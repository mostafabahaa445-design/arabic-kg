<style>:root{--ink:#251f21;--ink2:#585254;--hair:#eae9ea;--teal:#73a89a;--sand:#f4efec;--red:#ed313e}
*{box-sizing:border-box}
body{margin:0;background:#fcfbfa;color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.7;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:640px;margin:0 auto;padding:20px}
h1{font-size:30px;margin:8px 0 0;font-weight:500}
.sub{color:var(--ink2);margin:0 0 12px}
nav{display:flex;gap:4px;border-bottom:1px solid var(--hair);margin-bottom:16px}
nav button{flex:1;min-height:48px;border:0;background:none;font:inherit;color:var(--ink2);border-bottom:2px solid transparent}
nav button[aria-current=page]{color:var(--ink);border-bottom-color:var(--ink)}
h2{font-size:22px;font-weight:500;margin:8px 0}
.seg{display:flex;gap:8px;margin:8px 0}
.btn{min-height:44px;padding:0 18px;border:1px solid var(--hair);background:#fff;border-radius:6px;font:inherit;color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.sel{background:var(--teal);color:#fff;border-color:var(--teal)}
.big{display:flex;flex-direction:column;align-items:center;padding:20px 0;background:var(--sand);border-radius:24px;margin:16px 0}
.pic{line-height:0;margin-bottom:4px}.pic img{display:block}
.letter{font-size:96px;line-height:1.8}
.word{font-size:28px;font-weight:600;line-height:1.8}
.forms{display:flex;gap:28px;font-size:40px;line-height:2}
.row2{display:flex;gap:12px;justify-content:center;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.cell{min-height:44px;padding:0;font-size:22px;border:1px solid var(--hair);background:#fff;color:var(--ink);border-radius:8px;font-family:inherit;display:flex;align-items:center;justify-content:center}
.cell.on{background:var(--teal);color:#fff}.cell.bad{background:var(--red);color:#fff}
.msg{font-size:20px;font-weight:600;text-align:center}
.warn{background:var(--sand);border-radius:12px;padding:12px 16px;margin:12px 0}
h3{font-size:17px;margin:18px 0 4px}
ul{padding-inline-start:22px;margin:4px 0}
.foot{color:var(--ink2);font-size:14px;margin-top:24px}
</style>
</head>

const pic=x=>`<img src="${x.img}" alt="${x.word}" width="96" height="96">`;
function learn(){const it=LETTERS[idx];return `<h2>اتعلّم الحروف</h2>
<div class="seg"><button class="btn ${level==='kg1'?'sel':''}" data-a="lvl" data-v="kg1">كي جي ١</button><button class="btn ${level==='kg2'?'sel':''}" data-a="lvl" data-v="kg2">كي جي ٢</button></div>
<div class="big"><div class="pic">${pic(it)}</div><div class="letter">${it.l}</div><div class="word">${it.word}</div>${level==='kg2'?`<div class="forms">${['َ','ُ','ِ'].map(m=>`<span>${withMark(it.l,m)}</span>`).join('')}</div>`:''}</div>
<div class="row2"><button class="btn" data-a="prev">السابق</button><button class="btn primary" data-a="next">التالي</button></div>
<div class="grid">${LETTERS.map((x,n)=>`<button class="cell ${n===idx?'on':''}" data-a="pick" data-v="${n}">${x.l}</button>`).join('')}</div>`}
function quiz(){const i=(qn*5)%LETTERS.length,q=LETTERS[i];const opts=[7,13,19].map(k=>LETTERS[(i+k)%LETTERS.length].l);opts.splice(qn%4,0,q.l);const done=picked!==null,ok=picked===q.l;
return `<h2>إيه أول حرف؟</h2><p>النجوم اللي جمعتها: ${store.get()} ⭐ (محفوظة على الموبايل ده بس)</p>
<div class="big"><div class="pic">${pic(q)}</div><div class="word">${q.word}</div></div>
<div class="grid4">${opts.map(c=>`<button class="cell ${done&&c===q.l?'on':''} ${done&&c===picked&&!ok?'bad':''}" data-a="ans" data-v="${c}" ${done?'disabled':''}>${c}</button>`).join('')}</div>
${done?`<p class="msg" role="status">${ok?'برافو! ⭐':'قربت! الحرف الصح '+q.l}</p><div class="row2"><button class="btn primary" data-a="nextq">السؤال اللي بعده</button></div>`:''}`}
function marks(){const h=HARAKAT[hk];return `<h2>الحركات (كي جي ٢)</h2><p>اختار حركة وشوف مثال.</p>
<div class="seg">${HARAKAT.map((x,k)=>`<button class="btn ${k===hk?'sel':''}" data-a="hk" data-v="${k}">${x.n}</button>`).join('')}</div>
<div class="big"><div class="letter">${withMark('ب',h.m)}</div></div>
<div class="grid4">${LETTERS.slice(0,12).map(x=>`<span class="cell">${withMark(x.l,h.m)}</span>`).join('')}</div>`}
function teacher(){return `<h2>خطة حصة مقترحة</h2><div class="warn"><strong>مهم</strong><br>الخطة دي مقترحة بس، ولسه ما اتراجعتش على المنهج المصري الرسمي. راجعها مع المنهج قبل الاستخدام.</div>
<h3>كي جي ١ (حوالي ٢٠ دقيقة)</h3><ul><li>اعرض الحرف وصورة كلمة تبدأ بيه من شاشة «الحروف».</li><li>اطلب من الأطفال ينطقوا الحرف ويقلدوا شكله بإيديهم في الهوا.</li><li>لعبة «إيه أول حرف؟» مع الأهل أو في الفصل.</li><li>نشاط للبيت: دوّر على حاجة في البيت اسمها بيبدأ بالحرف.</li></ul>
<h3>كي جي ٢ (حوالي ٢٥ دقيقة)</h3><ul><li>راجع الحروف، وبعدين الحركات: فتحة وكسرة وضمة وسكون.</li><li>انطق الحرف مع كل حركة من شاشة «الحركات».</li><li>كوّن مقاطع وكلمات قصيرة مع الأطفال.</li><li>نشاط للبيت: الطفل يقرا ٣ كلمات لأهله.</li></ul>
<h3>للأهل</h3><ul><li>١٠ دقايق في اليوم كفاية.</li><li>خلّي الطفل ينطق بصوته ومتصحّحوش بحدّة.</li><li>مفيش بيانات شخصية للأطفال بتتسجل في التطبيق.</li></ul>`}
function render(){const T=[['letters','الحروف'],['quiz','لعبة'],['marks','الحركات'],['teacher','المدرّس']];
app.innerHTML=`<h1>تعلّم العربي</h1><p class="sub">نسخة تجريبية - كي جي ١ و٢</p><nav>${T.map(([k,v])=>`<button data-a="tab" data-v="${k}" ${k===tab?'aria-current="page"':''}>${v}</button>`).join('')}</nav>${{letters:learn,quiz,marks,teacher}[tab]()}<p class="foot">نسخة تجريبية. المحتوى لسه محتاج مراجعة على المنهج المصري.<br>الرسومات: Twemoji، حقوق Twitter وجهات مساهمة، رخصة CC-BY 4.0 (<a href="ATTRIBUTION.txt">تفاصيل</a>).</p>`}
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,n=LETTERS.length;
if(a==='tab'){tab=v}else if(a==='lvl'){level=v}else if(a==='next'){idx=(idx+1)%n}else if(a==='prev'){idx=(idx+n-1)%n}else if(a==='pick'){idx=+v}
else if(a==='ans'){if(picked!==null)return;picked=v;if(v===LETTERS[(qn*5)%n].l)store.set(store.get()+1)}else if(a==='nextq'){picked=null;qn++}else if(a==='hk'){hk=+v}
render()});
render();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
